name: Source and firmware checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Install build prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc llvm lld python3
          rustup toolchain install 1.96.1 --profile minimal --component rust-src,rustfmt,clippy --target thumbv7em-none-eabihf --no-self-update
      - name: Fetch pinned dependencies
        run: |
          RUSTC_BOOTSTRAP=1 cargo -Z build-std=core,compiler_builtins fetch --locked --target thumbv7em-none-eabihf
          cargo fetch --locked
          RUSTC_BOOTSTRAP=1 cargo -Z build-std=core,compiler_builtins fetch --manifest-path firmware/opta-m4-quarantine/Cargo.toml --locked --target thumbv7em-none-eabihf
      - name: Host regressions
        run: bash tools/check.sh
      - name: Build and validate both processors offline
        run: |
          python3 -B tools/check_m7_build_resource.py --build-std --release-candidate --version 1.3.8 --archive-dir "$PWD/build-output/archive" --output "$PWD/build-output/m7-report.json"
          python3 -B tools/check_m4_quarantine_build_resource.py --build-std --version 1.1.0 --archive-dir "$PWD/build-output/archive" --output "$PWD/build-output/m4-report.json"
