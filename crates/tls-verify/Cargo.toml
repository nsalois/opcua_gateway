[package]
name = "opta-tls-verify"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[dependencies]
digest = { version = "0.10", default-features = false, optional = true }
embedded-tls = { version = "0.19.0", default-features = false, optional = true }
purecrypto = { version = "0.6.21", default-features = false, features = ["bignum", "hash"] }

[features]
default = []
embedded-tls-019 = ["dep:digest", "dep:embedded-tls"]
